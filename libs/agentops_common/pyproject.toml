[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "redis>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["agentops_common*"]
