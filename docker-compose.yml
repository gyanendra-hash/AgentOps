services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  rate-limiter:
    build:
      context: .
      dockerfile: services/rate_limiter/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

  dummy-backend:
    build:
      context: .
      dockerfile: services/dummy_backend/Dockerfile
    ports:
      - "9000:9000"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      RATE_LIMITER_URL: http://rate-limiter:8001
      ROUTING_TABLE: '{"backend":["http://dummy-backend:9000"]}'
      FAIL_OPEN: "true"
    ports:
      - "8080:8080"
    depends_on:
      - rate-limiter
      - dummy-backend

  postgres:
    # pgvector/pgvector:pg16 is a drop-in postgres:16 image with the
    # pgvector extension pre-built, needed by agent-ops for embeddings.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
      POSTGRES_DB: agentops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops"]
      interval: 2s
      timeout: 2s
      retries: 15

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    environment:
      DATABASE_URL: postgresql://agentops:agentops@postgres:5432/agentops
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-pool:
    build:
      context: .
      dockerfile: services/worker_pool/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_URL: http://scheduler:8002
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
      scheduler:
        condition: service_started

  agent-ops:
    build:
      context: .
      dockerfile: services/agent_ops/Dockerfile
    environment:
      DATABASE_URL: postgresql://agentops:agentops@postgres:5432/agentops
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_URL: http://scheduler:8002
      RATE_LIMITER_URL: http://rate-limiter:8001
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler:
        condition: service_started
      rate-limiter:
        condition: service_started
